<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>while loop</title>
</head>
<body>
    
    <script>

// WHILE LOOP
// Condition true hone tak code repeat hota hai

let num = 1; // Initialization --> means [variable taiyyar karna]

while (num <= 5) {  // condiition [if 5 or 5 se less tab tak print numbers....]
  console.log(num);

  num++; // Updating --> zaroori hai 
         // 5 se jaise greater hua than ek increment karke ruk jana
        // agr ye define nhi karoge kab loop 
        // infinite hojayega 
}
console.log('final value of num is: ' + num);

    </script>
</body>
</html>
