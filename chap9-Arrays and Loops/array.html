<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Array Example</title>
</head>
<body>
    
    <script>
        // INDEX
// Array counting 0 se start hoti hai

let fruits = ["Apple", "Mango", "Banana"];

console.log(fruits[0]);
// Apple
console.log(fruits[2]);
// Banana

// Array me alag-alag type ki values store ho sakti hain

let data = ["juli", 20, true];

console.log(data.length);
// 3
    </script>
</body>
</html>
