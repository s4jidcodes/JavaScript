<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Logical-operator</title>
</head>
<body>
    <h1>LOGICAL OPERATORS</h1>

<script>
    // LOGICAL OPERATORS
// Multiple conditions ko combine karne ke liye

// && (AND)
// Sab conditions true honi chahiye

console.log(true && true);
// true

console.log(true && false);
// false


// || (OR)
// Ek bhi condition true ho to result true

/* console.log(true || false);
// true

console.log(false || false);
// false */

let age = 12; // here write your age
console.log(age < 18);
console.log(age > 65);

if (age < 18 || age > 65 ){
    console.log('use a Bicycle');
}
else{
console.log('You Can drive')
}



// ! (NOT)
// True ko false aur false ko true banata hai

console.log(!true);
// false

console.log(!false);
// true
</script>
</body>
</html>
