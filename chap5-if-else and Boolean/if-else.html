<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>if-else</title>
</head>
<body>
    

    <script>
        //if else
let age = 22; // here write your age 
console.log('checking if you can drive')

if (age > 18){
    console.log('you can drive');
}else{
    console.log('Use a Bicycle')
}


//if else-ladder

let marks = 82; // here write your marks
if (marks >= 90){
    console.log("A grade")
}
else if (marks >= 75){
    console.log( "B grade")
}
else if (marks >= 50){
    console.log("C grade")
}
else {
    console.log("Fail");
}



    </script>
</body>
</html>
