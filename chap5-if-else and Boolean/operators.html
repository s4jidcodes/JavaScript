<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>COMPARISON OPERATORS</title>
</head>
<body>
    <h1>COMPARISON OPERATORS</h1>
</body>
<script>

    // COMPARISON OPERATORS
// 2 values ko compare karte hain

// Result hamesha :
// true ya false

// == (Value Check)

console.log(5 == 5);
// true

console.log(5 == '5');
// true


// === (Value + Type Check)

console.log(5 === 5);
// true

console.log(5 === '5');
// false


// != (Value Not Equal)

console.log(5 != 10);
// true

console.log(5 != 5);
// false


// !== (Value + Type Not Equal)

console.log(5 !== '5');
// true

console.log(5 !== 5);
// false


// > (Greater Than)

console.log(10 > 5);
// true


// < (Less Than)

console.log(5 < 10);
// true


// >= (Greater Than or Equal)

console.log(10 >= 10);
// true

console.log(15 >= 10);
// true


// <= (Less Than or Equal)

console.log(10 <= 10);
// true

console.log(5 <= 10);
// true
</script>
</html>
