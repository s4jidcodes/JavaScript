<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Practiceset-4</title>
    <!--Variables
1. Save your name in a variable inside script tag
2. Display name from the variable on the "page"
3. Calculate the cost of Myntra Bag and keep it in a
variable
4. Show it to console
5. Keep GST percentage as constant
6. Use eval method from math to convert string
calculation into result-->

</head>
<body>
   <p id="name-display" ></p>

    <script>
        const myName ='Sajid';
        document.querySelector('#name-display').innerText =myName;
 
         const GSTpercentage = 18;
    let cartValue = Math.round(((15599 - (10/100 * 15599)) - 272 + (2499 - (41/100*2499)) - 29 + 25 + 20) * (100 + GSTpercentage) / 100);
    console.log(cartValue);

    console.log(eval('2+3+5*7-9'));
    </script>
</body>

</html>
