        function generateComputerChoice() {
        let Choice;    //local scope variable ke andar h
        // this will generate random number between 0 and 3
    let randomNumber = Math.random() * 3;
    if (randomNumber > 0 &&  randomNumber <= 1) {

      return 'Bat';  

    } else if (randomNumber > 1 && randomNumber <= 2)
    {
        return 'Ball'; 
      
    } else{
      return 'Stump';
     
    }return Choice;
}

 function getResult(userMove, computerMove){
    // kya karnega ? here based on userMove and computerMove we will compare and return result message(i.e resultMsg). then we will use that result message in alert message in button click event.(i.e in onclick event of button)

    if (userMove === 'Bat') {
        if (computerMove === 'Ball') {
            return 'user won.';
        } else if (computerMove === 'Bat'){
            return `It's a tie`;
        } else if (computerMove ==='Stump'){

        }
    } else if (userMove === 'Ball') {
        if (computerMove === 'Ball') {
            return `It's a tie`; //ball button par hai

            return 'User has won';
        } else if (computerMove ==='Stump'){

        }
    }

    return resultMsg;// kyu likha ? kyu ke agar koi bhi condition match nhi hui to undefined return hoga. so we can return resultMsg variable which is undefined by default.
 }

   // now alert let liye bhi hum new function mai define karenge. so that we can call it from any button click event.
   function showAlert(userMove, computerMove, resultMsg)
   {
