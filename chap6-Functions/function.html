<!DOCTYPE html>
<html lang="en">
<head>

    <title>Function</title>
</head>
<body>
    
    <script>
        let age = 21; 
        function printAge() { //here hamne function ko define kiya
            console.log(`your age is ${age}`); //here hamne function ko define kiya
        }
        printAge(); //here hamne function ko call kiya

        age = 25; //here hamne age ko update kiya
        printAge();     //here hamne function ko call kiya
        age = 30;
        printAge();
    </script>
</body>
</html>
