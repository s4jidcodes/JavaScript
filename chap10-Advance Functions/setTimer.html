        // setInterval()
       //    // Same function ko baar-baar chalata hai
      //    // Ye continuously repeat hota rahega
      //    setInterval(function () {
     //    console.log("Hello");
     //  }, 3000);

          
       // Alarm function banaya
     let alarm = () => console.log(`Wake up It's 7 o'clock.
     ${new Date()}`);

       // Har 2 second baad alarm function automatically chalega
      let intervalID = setInterval(alarm, 2000);

     // 6 second baad interval ko stop kar do
     setTimeout(() => clearInterval(intervalID), 6000);

    </script>
