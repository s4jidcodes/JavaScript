<!DOCTYPE html>
<html lang="en">
<head>
    <title>Updating Values</title>
</head>
<body>
    

    <script>
/*let age=20;
age =21;

// Variable = Variable + Value

let count = 5;   // variable define kiya hai

count = count + 1;   //Variable = Variable + Value hua hai

console.log(count);

// Output:
// 6


// Short Hand Operators

let num = 10; // ye defined variable hai ek baar [let] ke sath likha hai . then issi ko upadate karenge plus ,minus etc..

num += 5; // num = num + 5
console.log(num);

// Output: 15


num -= 3; // num = num - 3
console.log(num);

// Output: 12


num *= 2; // num = num * 2
console.log(num);

// Output: 24


num /= 4; // num = num / 4
console.log(num);

// Output: 6


// Increment Operator (++)

let likes = 10;

likes++;

console.log(likes);

// Output:
// 11


// Notes:
// = assign
// += add
// -= subtract
// *= multiply
// /= divide
// ++ add 1


    </script>
</body>
</html>
